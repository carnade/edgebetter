# Serves the built frontend and takes over the job Vite's dev server was doing.
#
# In development, vite.config.ts proxies /api to the api container. That proxy exists only
# while `npm run dev` runs, so a production build without this file would render fine and
# then 404 on every request it makes. This is the replacement, not an optimisation.

server {
    # 5173, not 80, deliberately. The base compose file maps ${WEB_PORT} to 5173 for the
    # dev server, and Compose *concatenates* port lists when you layer files rather than
    # replacing them -- so a production overlay cannot un-publish that mapping. Listening
    # on the same port the dev server uses means one mapping works for both modes, and the
    # overlay stays small enough to read.
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logs go to the container's stdout/stderr so `docker compose logs web` works.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The backend already serves everything under /api, so the prefix is passed straight
    # through rather than stripped.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some ingests and backtests are genuinely slow; don't cut them off at 60s.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Vite fingerprints asset filenames, so they can be cached hard and forever.
    location /assets/ {
        # One header only. `expires` emits its own Cache-Control, so pairing it with
        # add_header sends two conflicting ones.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers on the old bundle
    # pointing at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
